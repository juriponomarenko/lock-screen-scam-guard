<!DOCTYPE html>
<!--
  Simulated scam whose whole message is painted on a canvas, so the page has no
  readable text at all. Only its behaviour gives it away: it blocks reload,
  right-click and leaving. For testing only; the number is a fictional placeholder.

  Expected: no automatic navigation (behaviour alone is not proof), but the
  banner appears and its "Leave this page" button works despite the traps.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Loading...</title></head>
<body>
<script>
  const html = `
    <!DOCTYPE html>
    <html>
    <head><meta charset="utf-8" /><title>Loading...</title></head>
    <body style="margin:0;background:#002bff;overflow:hidden;">
      <canvas id="c"></canvas>
      <script>
        const c = document.getElementById('c');
        c.width = innerWidth; c.height = innerHeight;
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.textAlign = 'center';
        g.font = 'bold 28px Arial'; g.fillText('Your computer has been locked', c.width / 2, c.height / 2 - 40);
        g.font = '18px Arial'; g.fillText('Call Microsoft Support immediately', c.width / 2, c.height / 2);
        g.fillStyle = '#ffdd00'; g.font = 'bold 32px Arial'; g.fillText('1-800-555-0199', c.width / 2, c.height / 2 + 50);

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
          if (['F5', 'F11', 'F12', 'Escape'].includes(e.key) || e.ctrlKey) e.preventDefault();
        });
        window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
      <\/script>
    </body>
    </html>
  `;
  window.location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
</script>
</body>
</html>
