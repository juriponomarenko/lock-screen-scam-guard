<!DOCTYPE html>
<!--
  Simulated scam revealed after 2.5 seconds by changing only hidden, class or
  style (choose with ?attribute=hidden|class|style). No text nodes or title change.
  For testing only; the number is a fictional placeholder.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Loading...</title></head>
<body>
<script>
  const attribute = new URLSearchParams(location.search).get('attribute') || 'hidden';
  const conceal = {
    hidden: 'hidden',
    class: 'class="concealed"',
    style: 'style="display:none"',
  }[attribute];
  if (!conceal) throw new Error('Unknown reveal attribute');

  const html = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8" /><title>Loading...</title>
      <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .concealed { display: none; }
        #lock { position: fixed; inset: 0; background: #002bff; color: white;
                padding: 80px; text-align: center; }
      </style>
    </head>
    <body>
      <p>Loading...</p>
      <section id="lock" ${conceal}>
        <h1>Your computer has been locked</h1>
        <p>Unusual activity detected. Do not restart your computer.</p>
        <p>Call Microsoft Support: 1-800-555-0199</p>
      </section>
      <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
        setTimeout(() => {
          const lock = document.getElementById('lock');
          lock.removeAttribute('${attribute}');
        }, 2500);
      <\/script>
    </body>
    </html>
  `;
  window.location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
</script>
</body>
</html>
